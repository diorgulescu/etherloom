name: Build macOS Deliverables (.dmg & .app)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_intel:
        description: "Also cross-compile Intel macOS (x86_64-apple-darwin) deliverable"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_intel == 'false' || github.event.inputs.build_intel == false)) && fromJSON('[{"target":"aarch64-apple-darwin","arch":"arm64","label":"Apple Silicon (aarch64)"}]') || fromJSON('[{"target":"aarch64-apple-darwin","arch":"arm64","label":"Apple Silicon (aarch64)"},{"target":"x86_64-apple-darwin","arch":"x64","label":"Intel (x86_64)"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri v2 macOS .app & .dmg deliverables
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target ${{ matrix.target }}

      - name: Package GPLv3-compliant release archives & SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          DIST_OUT="release-artifacts-${{ matrix.arch }}"
          mkdir -p "$DIST_OUT"

          # Copy DMG installer
          DMG_SRC="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          cp "$DMG_SRC" "$DIST_OUT/Etherloom_${VERSION}_macos_${{ matrix.arch }}.dmg"

          # Package .app bundle alongside LICENSE, CREDITS.md, and helper scripts
          STAGE_DIR="$(mktemp -d)"
          cp -R "$BUNDLE_DIR/macos/Etherloom.app" "$STAGE_DIR/"
          cp LICENSE CREDITS.md README.md ARCHITECTURE.md "$STAGE_DIR/"
          cp -R scripts "$STAGE_DIR/scripts"
          tar -C "$STAGE_DIR" -czf "$DIST_OUT/Etherloom_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz" \
            Etherloom.app LICENSE CREDITS.md README.md ARCHITECTURE.md scripts
          rm -rf "$STAGE_DIR"

          # Compute SHA256 checksums
          (
            cd "$DIST_OUT"
            shasum -a 256 ./*.dmg ./*.tar.gz > "SHA256SUMS_${{ matrix.arch }}.txt"
            cat "SHA256SUMS_${{ matrix.arch }}.txt"
          )

      - name: Upload macOS deliverables to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Etherloom-macos-${{ matrix.arch }}
          path: release-artifacts-${{ matrix.arch }}/*
          if-no-files-found: error

      - name: Publish GitHub Release assets (on v*.*.* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts-${{ matrix.arch }}/*
