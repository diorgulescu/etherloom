# Etherloom Guided Academy Lab Manifest (GPL-3.0-or-later)
schema_version = 1
id = "06-freedos-mtcp-zero-noise"
number = 6
title = "Zero-Noise ARP & TCP Dissection with FreeDOS (mTCP)"
subtitle = "Eliminate modern OS background chatter completely by pairing 32-bit FreeDOS (PCNTPK 0x60 + mTCP) with an IPv6-quieted Alpine server—capturing the exact 4 frames of ARP+ICMP and a pure TCP stream in tcpflowy."
difficulty = "Beginner"
estimated_minutes = 20
tags = ["Zero-Noise", "FreeDOS i386", "ARP", "TCP Internals", "tcpflowy"]
required_catalog_ids = ["freedos", "alpine"]
required_os_profiles = ["freedos", "alpine-linux"]

[[steps]]
id = "step-1"
title = "Silence the Linux Peer Before Link-Up & Start TCP Listener"
summary = "Disable IPv6 on alpine-srv BEFORE bringing eth0 up so zero Router Solicitations, DAD, or mDNS frames touch the wire."
highlight_links = ["link-wire-a"]

[[steps]]
id = "step-2"
title = "Start .pcap + Live Wireshark on Wire A (Verify 0 Packets!)"
summary = "Tap link-wire-a and witness complete Ethernet silence—zero background noise while both VMs idle."
highlight_links = ["link-wire-a"]

[[steps]]
id = "step-3"
title = "Load PCNTPK INT 0x60 & Configure mTCP on FreeDOS"
summary = "Bind the AMD PCnet packet driver at software interrupt 0x60, write C:\\MTCP\\MTCP.CFG, and watch 1 ping emit the exact 4 textbook frames."
highlight_links = ["link-wire-a"]

[[steps]]
id = "step-4"
title = "Run a Pure TCP Session & Dissect Byte Math in tcpflowy"
summary = "Send a short payload via mTCP nc, then inspect the exact SYN -> PSH-ACK -> FIN sequence/ack math in tcpflowy with zero noise."
highlight_links = ["link-wire-a"]

