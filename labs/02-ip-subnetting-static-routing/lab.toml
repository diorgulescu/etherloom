# Etherloom Guided Academy Lab Manifest (GPL-3.0)
schema_version = 1
id = "02-ip-subnetting-static-routing"
number = 2
title = "IP Subnetting & Static Routing From Scratch"
subtitle = "Bridge two isolated /24 subnets by turning a dual-homed host into an IPv4 router, and verify MAC rewrites & TTL decrements on the wire."
difficulty = "Beginner"
estimated_minutes = 25
tags = ["Routing", "IPv4 Subnets", "ICMP/TTL", "Linux"]
required_os_profiles = ["alpine-linux"]

[[steps]]
id = "step-1"
title = "Configure Isolated Subnets 10.10.1.0/24 & 10.10.2.0/24"
summary = "Assign IPv4 addresses on host-a, rtr-1 (eth0 & eth1), and host-b, and observe Network Unreachable."
highlight_links = ["link-lan1", "link-lan2"]

[[steps]]
id = "step-2"
title = "Add Static Routes & Diagnose Missing IP Forwarding"
summary = "Point host-a at 10.10.1.1, capture link-lan1 vs link-lan2, and see why rtr-1 silently drops transit packets."
highlight_links = ["link-lan1", "link-lan2"]

[[steps]]
id = "step-3"
title = "Enable Kernel IPv4 Forwarding & Symmetric Return Routes"
summary = "Enable net.ipv4.ip_forward=1 on rtr-1 and add the return route on host-b."
highlight_links = ["link-lan2"]

[[steps]]
id = "step-4"
title = "Inspect L2 MAC Rewrite, TTL Decrement & TCP Flow Across Subnets"
summary = "Trigger ICMP Time Exceeded (TTL=1) and dissect an end-to-end routed HTTP request in tcpflowy."
highlight_links = ["link-lan1", "link-lan2"]

