# Etherloom Guided Academy Lab Manifest (GPL-3.0-or-later)
schema_version = 1
id = "08-mikrotik-openbsd-ebgp"
number = 8
title = "Multi-Vendor eBGP Peering & Route Failover: MikroTik CHR v7 ↔ OpenBSD (OpenBGPD)"
subtitle = "Establish RFC 8212-compliant eBGP sessions over TCP/179 between MikroTik RouterOS v7 (AS 65001) and OpenBSD OpenBGPD (AS 65002), dissect BGP OPEN/UPDATE/KEEPALIVE in tcpflowy, and test live Cut Cable failover."
difficulty = "Advanced"
estimated_minutes = 35
tags = ["eBGP", "MikroTik CHR v7", "OpenBSD OpenBGPD", "RFC 8212", "TCP/179"]
required_catalog_ids = ["mikrotik-chr", "openbsd", "alpine"]
required_os_profiles = ["mikrotik-chr", "openbsd", "alpine-linux"]

[[steps]]
id = "step-1"
title = "Bring Up Transit (/30) & Customer LAN (/24) Interfaces"
summary = "Configure MikroTik CHR v7 (ether1..ether3), OpenBSD (vio0..vio2 + ip.forwarding), and Alpine LAN hosts lan-a & lan-b."
highlight_links = ["link-lan-a", "link-ebgp-primary", "link-ebgp-backup", "link-lan-b"]

[[steps]]
id = "step-2"
title = "Start Wire Capture on Primary eBGP Transit (TCP Port 179)"
summary = "Arm .pcap recording + Live Wireshark on link-ebgp-primary BEFORE enabling BGP so the entire TCP/179 session bring-up is captured."
highlight_links = ["link-ebgp-primary"]

[[steps]]
id = "step-3"
title = "Configure RouterOS v7 BGP & OpenBSD /etc/bgpd.conf (RFC 8212!)"
summary = "Author explicit RFC 8212 import/export filters in RouterOS v7 (/routing/filter/rule + /routing/bgp/connection) and OpenBGPD."
highlight_links = ["link-ebgp-primary", "link-ebgp-backup"]

[[steps]]
id = "step-4"
title = "Dissect BGP in tcpflowy & Test Live 'Cut Cable' Route Failover"
summary = "Inspect TCP/179 OPEN, UPDATE (NLRI + AS_PATH), and KEEPALIVE heartbeats in tcpflowy, then cut link-ebgp-primary to watch live backup failover!"
highlight_links = ["link-ebgp-primary", "link-ebgp-backup"]

