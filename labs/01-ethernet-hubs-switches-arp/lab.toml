# Etherloom Guided Academy Lab Manifest (GPL-3.0)
schema_version = 1
id = "01-ethernet-hubs-switches-arp"
number = 1
title = "Ethernet, Hubs vs. Switches & ARP Under the Microscope"
subtitle = "Compare shared-medium L1 Hubs against learning L2 Switches, capture ARP broadcasts, and watch 802.1D MAC tables populate live."
difficulty = "Beginner"
estimated_minutes = 20
tags = ["L2/ARP", "Switching", "Hubs vs. Switches", "Wireshark"]
required_os_profiles = ["alpine-linux"]

[[steps]]
id = "step-1"
title = "Boot Host 1–3 & Assign Same-Subnet IPv4 Addresses"
summary = "Bring up eth0 on h1 (10.0.1.1/24), h2 (10.0.1.2/24), and h3 (10.0.1.3/24)."
highlight_links = ["link-h1-hub", "link-h2-hub", "link-h3-hub"]

[[steps]]
id = "step-2"
title = "Tap Host 3's Hub Wire & Observe Shared-Medium Flooding"
summary = "Record link-h3-hub while h1 pings h2 — witness unicast frames leaking onto h3's cable."
highlight_links = ["link-h3-hub"]

[[steps]]
id = "step-3"
title = "Re-Cable All 3 Hosts onto L2 Switch sw-1"
summary = "Move h1, h2, and h3 from hub-1 to sw-1 ports p1–p3 and inspect the live MAC table."
highlight_links = []

[[steps]]
id = "step-4"
title = "Verify ARP Broadcast vs. Unicast Isolation & Dissect in tcpflowy"
summary = "Flush ARP caches, capture on h3's switch port, and dissect a TCP stream on h1's wire."
highlight_links = ["link-h1-hub"]

