# Etherloom Guided Academy Lab Manifest (GPL-3.0-or-later)
schema_version = 1
id = "07-openwrt-8021q-vlans"
number = 7
title = "802.1Q VLAN Segmentation, Trunking & Inter-VLAN Routing on OpenWrt"
subtitle = "Configure modern OpenWrt UCI bridge-vlan filtering (no legacy swconfig!), prove L2 broadcast isolation, capture double-tagged 802.1Q frames on a trunk wire, and enforce fw4/nftables zone rules."
difficulty = "Intermediate"
estimated_minutes = 30
tags = ["802.1Q VLANs", "OpenWrt ARM64", "Bridge-VLAN / DSA", "L2 Isolation"]
required_catalog_ids = ["openwrt", "alpine"]
required_os_profiles = ["openwrt", "alpine-linux"]

[[steps]]
id = "step-1"
title = "Modern OpenWrt UCI Bridge-VLAN Switch & Router-on-a-Stick"
summary = "Configure vlan_filtering on openwrt-sw1 (eth0:u* VLAN 10, eth1:u* VLAN 20, eth2:t Trunk) and eth0.10 / eth0.20 on openwrt-rtr."
highlight_links = ["link-eng-access", "link-guest-access", "link-dot1q-trunk"]

[[steps]]
id = "step-2"
title = "Prove Layer-2 Broadcast Domain Isolation"
summary = "Tap host-guest's VLAN 20 access wire while host-eng sends broadcast ARP/pings in VLAN 10—confirming strict L2 separation."
highlight_links = ["link-eng-access", "link-guest-access"]

[[steps]]
id = "step-3"
title = "Inspect Double-Tagged 802.1Q Frames on the Trunk Wire"
summary = "Capture link-dot1q-trunk in Live Wireshark to watch cross-VLAN packets traverse the trunk twice (VLAN 10 -> Router -> VLAN 20 with TTL - 1)."
highlight_links = ["link-dot1q-trunk"]

[[steps]]
id = "step-4"
title = "Enforce fw4 / nftables Zone Policy & Verify in tcpflowy"
summary = "Block Guest (VLAN 20) -> Eng (VLAN 10) initiation while allowing stateful return flows, dissecting the TCP SYN rejection in tcpflowy."
highlight_links = ["link-dot1q-trunk", "link-guest-access"]

