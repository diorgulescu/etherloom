# Etherloom Guided Academy Lab Manifest (GPL-3.0)
schema_version = 1
id = "03-openbsd-pf-stateful-nat"
number = 3
title = "Stateful Firewalls & NAT with OpenBSD pf"
subtitle = "Write an idiomatic /etc/pf.conf from scratch on an OpenBSD gateway: default-deny policy, NAT masquerading (nat-to), port forwarding (rdr-to), and wire-level SYN verification."
difficulty = "Intermediate"
estimated_minutes = 30
tags = ["OpenBSD PF", "NAT", "Port Forwarding", "tcpflowy"]
required_os_profiles = ["openbsd", "alpine-linux"]

[[steps]]
id = "step-1"
title = "Bring Up LAN (192.168.10.0/24) & Simulated WAN (203.0.113.0/24)"
summary = "Configure lan-host, OpenBSD pf-gw (vio0 + vio1 + ip.forwarding), and wan-srv (no RFC1918 route)."
highlight_links = ["link-lan-pf", "link-pf-wan"]

[[steps]]
id = "step-2"
title = "Author /etc/pf.conf: Default Block + Outbound NAT (nat-to)"
summary = "Write a clean stateful ruleset with nat-to (vio1:0) so LAN hosts masquerade behind 203.0.113.1."
highlight_links = ["link-pf-wan"]

[[steps]]
id = "step-3"
title = "Add Inbound Port Forwarding (rdr-to) & Test Blocked vs. Passed SYNs"
summary = "Forward WAN TCP 8080 -> 192.168.10.10:8080 while rejecting unauthorized WAN ports."
highlight_links = ["link-lan-pf", "link-pf-wan"]

[[steps]]
id = "step-4"
title = "Compare LAN vs. WAN Captures in tcpflowy & Inspect pfctl -ss"
summary = "Verify address translation (192.168.10.10 -> 203.0.113.1) and RESET/UNANSWERED blocked SYNs."
highlight_links = ["link-lan-pf", "link-pf-wan"]

