# Etherloom Guided Academy Lab Manifest (GPL-3.0)
schema_version = 1
id = "04-openbsd-carp-pfsync-ha"
number = 4
title = "High-Availability Failover with OpenBSD CARP + pfsync"
subtitle = "Build an active/standby OpenBSD firewall cluster sharing virtual gateway IPs via CARP and replicating live pf TCP states over pfsync — then cut the master's cable mid-transfer!"
difficulty = "Advanced"
estimated_minutes = 35
tags = ["OpenBSD PF", "CARP / HA", "pfsync", "Cable Cut", "tcpflowy"]
required_os_profiles = ["openbsd", "alpine-linux"]

[[steps]]
id = "step-1"
title = "Configure Physical Interfaces & pfsync State-Replication Link"
summary = "Bring up vio0 (LAN), vio1 (WAN), and vio2 (pfsync 172.16.254.0/30) on fw-master and fw-backup."
highlight_links = ["link-pfsync"]

[[steps]]
id = "step-2"
title = "Configure CARP Virtual Gateways (carp0 & carp1) + Stateful pf"
summary = "Create shared VIPs 10.20.1.1 (LAN) and 198.51.100.1 (WAN) with advskew election & carp.preempt=1."
highlight_links = ["link-master-lan", "link-backup-lan"]

[[steps]]
id = "step-3"
title = "Cut fw-master's Cable Mid-Stream & Witness Hitless Failover!"
summary = "Record link-client-lan, start a multi-second TCP stream, and click Cut Cable on link-master-lan."
highlight_links = ["link-client-lan", "link-master-lan"]

[[steps]]
id = "step-4"
title = "Dissect the Failover Capture in tcpflowy"
summary = "Verify that the active TCP connection survived the physical router failure without a TCP RST!"
highlight_links = ["link-client-lan"]

