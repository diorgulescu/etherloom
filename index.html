<!doctype html>
<html lang="en" class="dark" style="background-color: #0D1321; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <title>Etherloom — Network Orchestration Studio</title>
    <script>
      (function () {
        try {
          var pref = window.localStorage.getItem("etherloom:theme-preference");
          var sysDark =
            !window.matchMedia ||
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark =
            pref === "light" ? false : pref === "system" ? sysDark : true;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.style.backgroundColor = "#0D1321";
            root.style.colorScheme = "dark";
          } else {
            root.classList.remove("dark");
            root.style.backgroundColor = "#F8FAFC";
            root.style.colorScheme = "light";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased select-none overflow-hidden bg-slate-50 text-slate-900 dark:bg-[#0D1321] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
